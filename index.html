 var t=T[L],ids=Object.keys(cart);

function drawer(on){$("drawer").classList.toggle("open",on);$("shade").classList.toggle("on",on)}

 var d=e.target.closest("[data-d]");if(d){detail(d.dataset.d);return}

 if(b.dataset.a){var id=b.dataset.a;if((cart[id]||0)<byId(id).s)cart[id]=(cart[id]||0)+1;if($("pd").open)$("pd").close();cartUI()}
 if(b.dataset.p){if(cart[b.dataset.p]<byId(b.dataset.p).s)cart[b.dataset.p]++;cartUI()}
 if(b.dataset.m){if(--cart[b.dataset.m]<1)delete cart[b.dataset.m];cartUI()}
});
document.addEventListener("change",function(e){var x=e.target;
 if(x.dataset.f){var a=sel[x.dataset.f]=sel[x.dataset.f]||[],i=a.indexOf(x.value);if(x.checked&&i<0)a.push(x.value);if(!x.checked&&i>-1)a.splice(i,1);render()}
